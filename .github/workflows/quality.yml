name: Validate City Guide data
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/validate.test.mjs
      - run: node scripts/build.mjs
      - run: test ! -e dist/data/preview.json && test ! -e dist/prototype/wireframe.html
